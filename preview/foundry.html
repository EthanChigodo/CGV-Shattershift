<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 2 - The Shifting Foundry // Preview</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      /* Preview-only chrome. None of this ships with the level. */
      .preview-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 8;
        display: flex;
        gap: 18px;
        align-items: center;
        padding: 10px 18px;
        background: linear-gradient(180deg, rgba(6, 10, 13, 0.92), rgba(6, 10, 13, 0));
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #90a5ad;
        pointer-events: none;
      }
      .preview-bar strong { color: #f0a93c; }
      .preview-bar em { font-style: normal; color: #f4fbff; }
      .preview-keys { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
      .preview-keys span { color: #6f8088; }
      .preview-keys b { color: #f4fbff; }
      .preview-reticle {
        position: fixed;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border: 1px solid rgba(126, 244, 241, 0.85);
        border-radius: 50%;
        pointer-events: none;
        z-index: 7;
        transition: border-color 0.12s ease, transform 0.12s ease;
      }
      .preview-reticle.hot {
        border-color: #7ef4f1;
        transform: scale(1.45);
        box-shadow: 0 0 16px rgba(126, 244, 241, 0.7);
      }
      .preview-status {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 7;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #90a5ad;
      }
      .preview-status b { color: #f4fbff; }
      @media (max-width: 640px) {
        .preview-bar { font-size: 9px; gap: 10px; padding: 8px 10px; }
        .preview-keys { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Foundry preview canvas"></canvas>

    <div class="preview-bar">
      <strong>SECTOR 02</strong>
      <em>THE SHIFTING FOUNDRY</em>
      <span>ENVIRONMENT + UI PREVIEW</span>
      <div class="preview-keys">
        <span><b>A</b>/<b>D</b> lane</span>
        <span><b>SPACE</b> jump</span>
        <span><b>SHIFT</b> slide</span>
        <span><b>CLICK</b> shoot switch</span>
        <span><b>C</b> camera</span>
        <span><b>F</b> stats</span>
        <span><b>R</b> restart</span>
      </div>
    </div>

    <div id="reticle" class="preview-reticle"></div>
    <div class="preview-status">
      CAMERA <b id="cameraName">CHASE</b> &nbsp;//&nbsp; BEAT <b id="beatName">INTAKE</b>
    </div>

    <script type="module" src="./foundry-preview.js"></script>
  </body>
</html>
