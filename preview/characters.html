<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Characters // Preview</title>
    <!-- Same import map as the game: "three" must resolve to src/three.js's copy. -->
    <script type="importmap">
      {
        "imports": {
          "three": "../lib/three/build/three.module.js",
          "three/addons/": "../lib/three/examples/jsm/"
        }
      }
    </script>
    <style>
      /* Preview-only chrome. None of this ships with the game. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d0e; color: #dfe8ea; font: 13px/1.45 Inter, "Segoe UI", Arial, sans-serif; }
      canvas { display: block; }
      .panel { position: fixed; top: 12px; left: 12px; bottom: 12px; width: 300px; overflow: auto; padding: 14px 16px; background: rgba(8, 11, 12, 0.86); border: 1px solid #22302f; border-radius: 8px; }
      h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #6fe3d6; }
      h2 { margin: 14px 0 6px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8fa3a8; }
      p { margin: 4px 0; color: #9fb0b3; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button { font: inherit; padding: 5px 9px; border-radius: 5px; border: 1px solid #2c3d3c; background: #142020; color: #dfe8ea; cursor: pointer; }
      button.on { border-color: #6fe3d6; background: #1d3533; }
      button.missing { opacity: 0.45; border-style: dashed; }
      .swatch { width: 24px; height: 24px; padding: 0; border-radius: 50%; }
      .info { white-space: pre-wrap; font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #b6c6c8; }
      .warn { color: #ffb547; }
      label { display: flex; gap: 8px; align-items: center; color: #9fb0b3; }
      input[type="range"] { flex: 1; }
      .empty { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; color: #8fa3a8; text-align: center; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Characters</h1>
      <p id="source"></p>
      <h2>Role</h2>
      <div class="row" id="roles"></div>
      <h2>Clip</h2>
      <div class="row" id="clips"></div>
      <h2>Over the clip</h2>
      <div class="row">
        <button id="hit">Hit</button>
        <button id="die">Die</button>
        <button id="turn" class="on">Turntable</button>
        <button id="walkabout">Walk about</button>
      </div>
      <label>Speed <input id="speed" type="range" min="0" max="9" step="0.1" value="0" /><span id="speedValue">clip rate</span></label>
      <h2>Skin (player)</h2>
      <div class="row" id="skin"></div>
      <h2>Hair (player)</h2>
      <div class="row" id="hair"></div>
      <label>Wear <input id="wear" type="range" min="0" max="0.66" step="0.01" value="0" /></label>
      <h2>Check</h2>
      <div class="info" id="info"></div>
    </div>
    <div class="empty" id="empty" hidden></div>
    <script type="module" src="./characters-preview.js"></script>
  </body>
</html>
